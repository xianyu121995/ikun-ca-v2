<body>
<div id="app">
  <aside class="sidebar" aria-label="侧边导航">
    <div class="brand"><span class="logo">◖</span><div><h1>ikun.ca</h1><small>Research Terminal</small></div></div>
    <div class="group-label">工作空间</div>
    <button class="nav-btn" type="button" data-nav="主页"><span class="ni">⌂</span><span>主页</span></button>
    <button class="nav-btn active" type="button" data-nav="猎手监控"><span class="ni">◎</span><span>猎手监控</span></button>
    <button class="nav-btn" type="button" data-nav="猎手项目监控"><span class="ni">◉</span><span>猎手项目监控</span></button>
    <div class="nav-hint">猎手关注发现 → 项目研究 → 人工加入持续监控</div>
    <div class="sidebar-spacer"></div>
    <div class="side-bottom"><strong><span class="live-dot"></span>UI 原型模式</strong><p>仅演示交互<br/>不连接真实 API / 数据库</p></div>
  </aside>
  <main class="main">
    <section class="discovery" aria-label="项目发现">
      <header class="top">
        <div class="crumb"><div>控制台 &nbsp;/&nbsp; <b>HunterRadar 猎手监控</b></div><div class="top-actions"><span class="prototype-chip">● 演示数据 · 非真实监控</span></div></div>
        <div class="header-row"><div><h1 class="page-title">项目发现 <span style="font-size:12px;color:#7495a4;vertical-align:middle;font-weight:500">/ Discovery Feed</span></h1><p class="subtitle">72 小时内至少 2 位不同猎手关注同一账号，进入待研究列表</p></div><div class="title-buttons"><button class="btn" id="stateMenu" type="button">◫&nbsp; 测试页面状态</button><button class="btn soft" id="manageHunters" type="button">⚙&nbsp; 猎手管理</button></div></div>
        <div class="kpis" id="kpis"><div class="kpi"><div class="kpi-top">发现项目</div><strong>—</strong></div></div>
      </header>
      <section class="filters" aria-label="搜索和筛选">
        <div class="search-wrap"><input id="search" class="control" placeholder="搜索 X 账号、简介、项目名称…" aria-label="搜索项目" /></div>
        <select class="control" id="timeFilter" aria-label="时间筛选"><option value="all">全部时间</option><option value="24">最近 24 小时</option><option value="72">最近 72 小时</option><option value="168">最近 7 天</option></select>
        <div class="seg" id="gradeFilters" aria-label="评分筛选"><button class="on" data-grade-filter="all">全部</button><button data-grade-filter="S">S</button><button data-grade-filter="A">A</button><button data-grade-filter="B">B</button><button data-grade-filter="none">待评分</button></div>
        <select id="statusFilter" class="control" aria-label="状态筛选"><option value="all">全部状态</option><option value="pending">待研究</option><option value="reviewed">已研究</option><option value="joined">已加入监控</option></select>
        <button class="btn small ghost" type="button" id="resetFilters">↺ 重置</button>
        <span class="f-right" id="resultCount">— 条发现</span>
      </section>
      <div class="table-shell" id="tableShell"><table class="data-table" aria-label="项目发现表"><colgroup><col style="width:105px"><col style="width:175px"><col><col style="width:91px"><col style="width:65px"><col style="width:100px"><col style="width:130px"></colgroup><thead><tr><th class="sortable" data-sort="time">发现时间 ↕</th><th class="sortable" data-sort="name">X 账号 ↕</th><th>主页简介 / 项目线索</th><th class="sortable" data-sort="hunters">发现猎手 ↕</th><th class="sortable" data-sort="rating">评分 ↕</th><th>研究状态</th><th style="text-align:right">操作</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="empty">加载演示数据…</td></tr></tbody></table></div>
      <footer class="table-footer"><div id="footerText">纯 UI 模拟 · 不写入数据库</div><div class="page-controls"><span id="pageCount">1 / 1</span><button class="page-btn" id="prevPage" aria-label="上一页">‹</button><button class="page-btn" id="nextPage" aria-label="下一页">›</button></div></footer>
    </section>
    <aside class="drawer hidden" id="drawer" aria-label="项目资料编辑面板"><header class="drawer-head" id="drawerHead"></header><div class="drawer-scroll" id="drawerBody"></div></aside>
  </main>
</div>
<div id="overlay" class="overlay hidden" role="presentation"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

 ['Wisp Network','wisp_network','轻量级去中心化协作工具，实验性开源产品。',2,'none','pending',58],
 ['Fjord Exchange','fjord_exchange','探索新型衍生品清算结构与订单簿交易。',2,'A','joined',68],
 ['Parallax AI','parallaxai_xyz','链上智能体身份、执行记录与可审计策略框架。',3,'B','reviewed',78],
 ['Terra Mesh','terramesh_io','用于实体设备协作的分布式地图与位置数据协议。',2,'none','pending',92],
 ['Luma Commons','luma_commons','可编程会员关系与链上激励产品。',2,'none','pending',106],
 ['Vanta Compute','vanta_compute','去中心化 GPU 计算市场，实验性调度网络。',4,'S','reviewed',118],
 ['Nova Settlement','nova_settle','稳定币支付路由与商户结算 SDK。',2,'B','joined',132],
 ['Tessera Labs','tessera_labs','研究隐私可组合性与零知识证明应用。',3,'none','pending',153],
 ['Arcfield','arcfield_xyz','安全优先的链上资产运营管理平台。',2,'A','reviewed',177],
 ['Prism Index','prism_index','针对开放生态的项目发现与可信信号聚合。',3,'none','pending',204]
];
let projects=seed.map((r,i)=>({id:'demo-'+(i+1),name:r[0],handle:r[1],bio:r[2],hunters:r[3],grade:r[4],status:r[5],hours:r[6],foundAt:Date.now()-r[6]*3600000,website:i%3===0?'https://example.org/':'',description:i===2?'早期 DeFi 项目，研究储备证明与模块化策略。':'',token:'unknown',notes:'',watch:false}));
let hunters=[{name:'AlphaScout',handle:'alphascout',followers:12600,enabled:true},{name:'SignalFlow',handle:'signalflow',followers:7800,enabled:true},{name:'GemFinder',handle:'gemfinder',followers:4200,enabled:true},{name:'FirstMover',handle:'firstmover',followers:15400,enabled:true},{name:'OceanWatcher',handle:'oceanwatcher',followers:2800,enabled:false}];
let ui={query:'',time:'all',grade:'all',status:'all',selected:null,page:1,perPage:10,sort:'time',direction:-1,mode:'normal'};
let toastTimer=null,modalAction=null;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=ms=>new Date(ms).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(/\//g,'/').replace(', ',' ');
const gradeLabel=g=>g==='none'?'待评':g;
const statText=s=>({pending:'待研究',reviewed:'已研究',joined:'已加入监控'})[s]||'待研究';
function msg(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3000)}
function calc(){return projects.filter(p=>{let text=[p.name,p.handle,p.bio,p.description,p.notes].join(' ').toLowerCase();return (!ui.query||text.includes(ui.query.toLowerCase()))&&(ui.time==='all'||Date.now()-p.foundAt<=Number(ui.time)*3600000)&&(ui.grade==='all'||p.grade===ui.grade)&&(ui.status==='all'||p.status===ui.status)}).sort((a,b)=>{let v=0;if(ui.sort==='time')v=a.foundAt-b.foundAt;if(ui.sort==='name')v=a.name.localeCompare(b.name);if(ui.sort==='hunters')v=a.hunters-b.hunters;if(ui.sort==='rating'){const map={none:0,B:1,A:2,S:3};v=map[a.grade]-map[b.grade]}return v*ui.direction})}
function renderStats(){const stats=[['累计发现',projects.length,'◇',''],['待研究',projects.filter(p=>p.status==='pending').length,'⌕','yellow'],['已评分',projects.filter(p=>p.grade!=='none').length,'★','blue'],['已加入监控',projects.filter(p=>p.status==='joined').length,'◉','teal']];$('#kpis').innerHTML=stats.map(([label,value,sig,color])=>`<div class="kpi"><div class="kpi-top">${label}<span class="kpi-sig">${sig}</span></div><strong class="${color}">${value.toString().padStart(2,'0')}</strong></div>`).join('')}
function renderTable(){renderStats();$$('#gradeFilters button').forEach(b=>b.classList.toggle('on',b.dataset.gradeFilter===ui.grade));const tbody=$('#tbody'),all=calc(),pages=Math.max(1,Math.ceil(all.length/ui.perPage));if(ui.page>pages)ui.page=pages;
$('#resultCount').textContent=`${all.length} 条匹配发现`;$('#pageCount').textContent=`${ui.page} / ${pages}`;$('#prevPage').disabled=ui.page<=1;$('#nextPage').disabled=ui.page>=pages;$('#footerText').textContent=ui.mode==='normal'?`显示 ${all.length?((ui.page-1)*ui.perPage+1):0}–${Math.min(ui.page*ui.perPage,all.length)} / ${all.length} 条 · 演示数据，仅浏览器内有效`:'UI 页面状态模拟';
if(ui.mode==='loading'){tbody.innerHTML=`<tr><td colspan="7"><div class="skeleton"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><p>正在载入项目发现记录…（模拟状态）</p><button class="btn small" data-mode="normal">返回正常列表</button></div></td></tr>`;return}
if(ui.mode==='error'){tbody.innerHTML=`<tr><td colspan="7"><div class="empty"><div class="empty-glyph">⚠</div><h3>发现记录获取失败</h3><p>模拟接口请求失败，未触碰真实服务</p><button class="btn primary" data-mode="normal">重新加载</button></div></td></tr>`;return}
if(ui.mode==='empty'||!all.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty"><div class="empty-glyph">⌕</div><h3>暂无匹配的项目</h3><p>${ui.mode==='empty'?'这是空数据演示状态':'试试清除关键词或调整筛选条件'}</p><button class="btn" data-mode="normal" data-clear="1">清空筛选 / 返回列表</button></div></td></tr>`;return}
tbody.innerHTML=all.slice((ui.page-1)*ui.perPage,ui.page*ui.perPage).map(p=>`<tr data-row="${esc(p.id)}" class="${ui.selected===p.id?'selected':''}"><td><span class="date">${fmt(p.foundAt)}</span></td><td><div class="account"><span class="avatar">${esc(p.name[0])}</span><div class="account-info"><strong title="${esc(p.name)}">${esc(p.name)}</strong><small>@${esc(p.handle)}</small></div></div></td><td><div class="bio" title="${esc(p.bio)}">${esc(p.bio)}</div></td><td class="hunter-cell"><span class="hunter-number">${p.hunters} 位</span>猎手</td><td><span class="rating ${esc(p.grade)}">${gradeLabel(p.grade)}</span></td><td><span class="status ${p.status}"><i></i>${statText(p.status)}</span></td><td><div class="act"><button class="btn small" data-x="${p.id}">X 主页 ↗</button><button class="btn small soft" data-edit="${p.id}">研究 / 编辑</button></div></td></tr>`).join('');
}
function selected(){return projects.find(p=>p.id===ui.selected)}
function drawerHead(p){return `<button class="drawer-back" id="closeDrawer">← 收起资料 / 返回全宽表格</button><div class="drawer-identity"><span class="avatar">${esc(p.name[0])}</span><div><h2>${esc(p.name)}</h2><p>@${esc(p.handle)} &nbsp; · &nbsp; <span class="rating ${esc(p.grade)}" style="height:17px;min-width:24px">${gradeLabel(p.grade)}</span></p></div></div><div class="drawer-meta"><span>发现：${fmt(p.foundAt)}</span><span>·</span><span>${p.hunters} 位猎手关注</span><span>·</span><span>${statText(p.status)}</span></div><div class="drawer-section-title">项目资料</div>`}
function drawerBody(p){return `<div class="drawer-note">演示编辑区：所有修改仅保存在当前浏览器页面内，刷新即恢复。不会添加任何真实监控任务。</div>
<form id="projectForm">
<div class="field"><label class="label">X 账号 <small>自动识别 · 不可修改</small></label><input class="read-only" value="@${esc(p.handle)}" readonly /></div>
<div class="field"><label class="label" for="projectName">项目名称</label><input id="projectName" name="name" maxlength="100" required value="${esc(p.name)}" /></div>
<div class="field"><label class="label" for="projectBio">X 主页简介</label><textarea id="projectBio" name="bio" rows="2">${esc(p.bio)}</textarea></div>
<div class="field"><label class="label" for="projectWebsite">项目官网</label><input id="projectWebsite" name="website" placeholder="https://…" value="${esc(p.website)}" /></div>
<div class="field"><label class="label" for="projectDesc">项目简介 / 研究结论</label><textarea id="projectDesc" name="description" rows="4" placeholder="记录项目定位、玩法、风险及核实结果…">${esc(p.description)}</textarea></div>
<div class="field"><label class="label" for="token">代币计划</label><select name="token" id="token"><option value="unknown" ${p.token==='unknown'?'selected':''}>待确认</option><option value="planned" ${p.token==='planned'?'selected':''}>明确有代币计划</option><option value="none" ${p.token==='none'?'selected':''}>暂无代币计划</option></select></div>
<div class="field"><label class="label">项目评分 <small>人工评分</small></label><div class="score-buttons" id="scoreButtons">${[['S','S'],['A','A'],['B','B'],['none','待定']].map(([v,s])=>`<button type="button" class="score-btn ${p.grade===v?'on':''}" data-grade="${v}">${s}</button>`).join('')}</div><input type="hidden" name="grade" id="gradeInput" value="${p.grade}" /></div>
<div class="field"><label class="label" for="notes">个人备注 / 进度</label><textarea id="notes" name="notes" rows="3" placeholder="例如：等待测试网、代币经济尚未公布…">${esc(p.notes)}</textarea></div>
<div class="divider"></div><label class="check-row"><input id="confirmWatch" type="checkbox" ${p.watch?'checked':''} /><span>标记为「值得持续关注」<div class="help">仅作项目资料标记，不代表已成功启动 6551 监控。</div></span></label>
<div class="drawer-action"><button type="submit" class="btn primary">▣ &nbsp;保存项目资料</button><button type="button" class="btn ${p.status==='joined'?'':'soft'}" id="joinProject" ${p.status==='joined'?'disabled':''}>${p.status==='joined'?'✓ 已加入（演示）':'＋ 加入项目监控'}</button></div>
<p class="help">加入监控操作将弹出二次确认；本原型不会发起后台任务。</p></form>`}
function renderDrawer(){let p=selected();if(!p){$('#drawer').classList.add('hidden');return}$('#drawer').classList.remove('hidden');$('#drawerHead').innerHTML=drawerHead(p);$('#drawerBody').innerHTML=drawerBody(p)}
function openDrawer(id){ui.selected=id;renderTable();renderDrawer()}
function closeDrawer(){ui.selected=null;renderDrawer();renderTable()}
function resetFilters(){ui.query='';ui.time='all';ui.grade='all';ui.status='all';ui.page=1;$('#search').value='';$('#timeFilter').value='all';$('#statusFilter').value='all'}
function showModal(content,small=false){$('#modal').className='modal'+(small?' sm':'');$('#modal').innerHTML=content;$('#overlay').classList.remove('hidden')}
function hideModal(){modalAction=null;$('#overlay').classList.add('hidden');$('#modal').innerHTML=''}
function confirmDialog(title,body,callback,confirm='确认操作'){modalAction=callback;showModal(`<div class="modal-head"><h2>${esc(title)}</h2><button class="close" data-dismiss aria-label="关闭">×</button></div><div class="modal-body"><p class="modal-desc" style="font-size:12px;margin:0">${esc(body)}</p></div><div class="modal-footer"><button class="btn" data-dismiss>取消</button><button class="btn primary" id="modalConfirm">${esc(confirm)}</button></div>`,true)}
function huntersModal(){
const total=hunters.length, active=hunters.filter(h=>h.enabled).length;
showModal(`<div class="modal-head"><h2>猎手管理 <span class="prototype-chip" style="vertical-align:middle;margin-left:6px">演示</span></h2><button class="close" data-dismiss aria-label="关闭">×</button></div>
<div class="modal-body">
<p class="modal-desc">按 X 用户名管理猎手，不展示现有猎手账号列表。以下均为本地交互演示，不会修改实际监控。</p>
<div class="hunter-summary"><div><small>配置猎手数量</small><strong>${total}</strong></div><div><small>监控中</small><strong>${active}</strong></div><div><small>已停用</small><strong>${total-active}</strong></div></div>
<div class="field"><label class="label" for="hunterAction">选择操作</label><select id="hunterAction" class="control hunter-control"><option value="add">添加猎手</option><option value="enable">启用指定猎手</option><option value="disable">停用指定猎手</option><option value="remove">移除指定猎手</option></select></div>
<div class="field"><label class="label" for="hunterHandle">X 用户名</label><input id="hunterHandle" class="control hunter-control" autocomplete="off" placeholder="输入 @用户名" maxlength="16" /><p class="help">直接输入需要操作的账号，不显示现有账号明细。</p></div>
<button class="btn primary" id="manageHunterApply" type="button">确认执行（演示）</button>
</div><div class="modal-footer"><button class="btn" data-dismiss>关闭</button></div>`);
}

function stateModal(){showModal(`<div class="modal-head"><h2>页面状态测试</h2><button class="close" data-dismiss>×</button></div><div class="modal-body"><p class="modal-desc">选择不同状态检查加载、错误、空数据及正常内容。仅修改视觉显示。</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px"><button class="btn" data-test-mode="normal">✓ 正常列表</button><button class="btn" data-test-mode="loading">◌ 加载状态</button><button class="btn" data-test-mode="error">⚠ 失败与重试</button><button class="btn" data-test-mode="empty">⌕ 空数据状态</button></div></div><div class="modal-footer"><button class="btn" data-dismiss>关闭</button></div>`,true)}
$('#tbody').addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(x){msg('演示账号：@'+projects.find(p=>p.id===x.dataset.x).handle+'。未打开虚构的外部账号。');return}const e=ev.target.closest('[data-edit]');if(e){openDrawer(e.dataset.edit);return}const r=ev.target.closest('[data-row]');if(r)openDrawer(r.dataset.row);const mode=ev.target.closest('[data-mode]');if(mode){ui.mode=mode.dataset.mode;if(mode.dataset.clear)resetFilters();renderTable()}});
$('#search').addEventListener('input',e=>{ui.query=e.target.value;ui.page=1;ui.mode='normal';renderTable()});
$('#timeFilter').addEventListener('change',e=>{ui.time=e.target.value;ui.page=1;ui.mode='normal';renderTable()});
$('#statusFilter').addEventListener('change',e=>{ui.status=e.target.value;ui.page=1;ui.mode='normal';renderTable()});
$('#gradeFilters').addEventListener('click',e=>{let b=e.target.closest('[data-grade-filter]');if(!b)return;ui.grade=b.dataset.gradeFilter;ui.page=1;ui.mode='normal';renderTable()});
$('#resetFilters').addEventListener('click',()=>{resetFilters();ui.mode='normal';renderTable()});
$$('[data-sort]').forEach(b=>b.addEventListener('click',()=>{if(ui.sort===b.dataset.sort)ui.direction*=-1;else{ui.sort=b.dataset.sort;ui.direction= b.dataset.sort==='name'?1:-1}ui.page=1;renderTable()}));
$('#prevPage').addEventListener('click',()=>{ui.page=Math.max(1,ui.page-1);renderTable();$('#tableShell').scrollTop=0});$('#nextPage').addEventListener('click',()=>{ui.page++;renderTable();$('#tableShell').scrollTop=0});
$('#manageHunters').addEventListener('click',huntersModal);$('#stateMenu').addEventListener('click',stateModal);
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav!=='猎手监控')msg('“'+b.dataset.nav+'”由其他模块开发。本原型只提供猎手监控页面。')}));
$('#drawer').addEventListener('click',ev=>{if(ev.target.closest('#closeDrawer')){closeDrawer();return}const score=ev.target.closest('[data-grade]');if(score){$('#gradeInput').value=score.dataset.grade;$$('#scoreButtons .score-btn').forEach(b=>b.classList.toggle('on',b===score));return}if(ev.target.closest('#joinProject')){let p=selected();if(!p)return;const name=$('#projectName').value.trim();if(!name){msg('请先填写项目名称');return}confirmDialog('加入猎手项目监控',`确定将“${name}”加入项目监控吗？这是演示操作，不会占用 6551 名额，也不会修改生产配置。`,()=>{p.status='joined';p.watch=true;renderTable();renderDrawer();msg('演示成功：已加入监控（仅当前页面）')},'确认加入（模拟）')}});
$('#drawer').addEventListener('submit',ev=>{if(ev.target.id!=='projectForm')return;ev.preventDefault();let p=selected();if(!p)return;const f=ev.target;const name=f.elements.name.value.trim(),site=f.elements.website.value.trim();if(!name){msg('项目名称不能为空');return}if(site&&!/^https?:\/\//i.test(site)){msg('官网请输入以 http:// 或 https:// 开头的网址');return}p.name=name;p.bio=f.elements.bio.value.trim();p.website=site;p.description=f.elements.description.value.trim();p.token=f.elements.token.value;p.grade=f.elements.grade.value;p.notes=f.elements.notes.value.trim();p.watch=$('#confirmWatch').checked;if(p.status==='pending')p.status='reviewed';renderTable();renderDrawer();msg('演示保存成功：资料已在当前页面更新')});
$('#overlay').addEventListener('click',ev=>{if(ev.target===$('#overlay')||ev.target.closest('[data-dismiss]')){hideModal();return}if(ev.target.closest('#modalConfirm')){const cb=modalAction;hideModal();if(cb)cb();return}if(ev.target.closest('#manageHunterApply')){
 const input=$('#hunterHandle');
 const handle=(input.value||'').trim().replace(/^@/,'');
 const action=$('#hunterAction').value;
 if(!/^[a-zA-Z0-9_]{1,15}$/.test(handle)){msg('请输入 1–15 位英文、数字或下划线的 X 用户名');input.focus();return}
 const idx=hunters.findIndex(h=>h.handle.toLowerCase()===handle.toLowerCase());
 if(action==='add'){
  if(idx>=0){msg('这个演示账号已存在');return}
  hunters.push({name:handle,handle,followers:0,enabled:false});huntersModal();msg('模拟添加成功（默认停用）');return;
 }
 if(idx<0){msg('演示数据中未找到该账号');return}
 if(action==='enable'){
  hunters[idx].enabled=true;huntersModal();msg('模拟启用成功');return;
 }
 if(action==='disable'){
  confirmDialog('停用指定猎手',`确认停用 @${handle} 吗？仅演示，不影响真实监控。`,()=>{const h=hunters.find(x=>x.handle.toLowerCase()===handle.toLowerCase());if(h)h.enabled=false;huntersModal();msg('模拟停用成功')},'确认停用（演示）');return;
 }
 if(action==='remove'){
  confirmDialog('移除指定猎手',`确认移除 @${handle} 吗？仅演示，不影响真实配置。`,()=>{const i=hunters.findIndex(x=>x.handle.toLowerCase()===handle.toLowerCase());if(i>=0)hunters.splice(i,1);huntersModal();msg('模拟移除成功')},'确认移除（演示）');return;
 }
 return;
}
const m=ev.target.closest('[data-test-mode]');if(m){ui.mode=m.dataset.testMode;hideModal();renderTable();closeDrawer()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#overlay').classList.contains('hidden'))hideModal();else if(ui.selected)closeDrawer()}});
renderTable();
})();
</script>
</body>
</html>
