<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ikun.ca</title><link rel="stylesheet" href="/auth/assets/auth.css"><script src="/auth/assets/auth.js" defer></script></head>
<body data-page="login"><div class="login-shell"><header class="brand"><span class="brand-mark" aria-hidden="true">i</span><div>ikun.ca<small>Web3 Workspace</small></div></header><main class="login-body"><section class="intro"><span class="eyebrow">YOUR WORKSPACE</span><h1>欢迎回来。<br>继续你的 Web3 研究。</h1><p>项目、监控与账号，集中管理。<br>登录后访问你的工作空间。</p></section><section class="card" aria-labelledby="login-title"><h2 id="login-title">登录工作空间</h2><p class="sub">使用管理员为你创建的账号登录。</p><form id="login-form" method="post" action="/api/v1/auth/login"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="32" placeholder="输入用户名" autofocus><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入密码"><button class="reveal" type="button" data-reveal="password" aria-label="显示密码" aria-pressed="false">显示</button></div><p id="status" class="notice" role="status" aria-live="polite"></p><button class="button primary submit" type="submit">登录</button></form><p class="note">不开放公开注册。忘记密码请联系超级管理员。</p></section></main><footer><span>ikun.ca · Web3 Workspace</span><span>仅向已授权用户开放</span></footer></div></body></html>
