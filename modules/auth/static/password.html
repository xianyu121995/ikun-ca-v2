<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码 · ikun.ca</title><link rel="stylesheet" href="/auth/assets/auth.css"><script src="/auth/assets/auth.js" defer></script></head><body data-page="password"><header class="topbar"><a class="brand" href="/auth"><span class="brand-mark" aria-hidden="true">i</span><div>ikun.ca<small>Web3 Workspace</small></div></a><nav><button class="button" data-logout>退出登录</button></nav></header><main class="workspace"><section class="card account-card"><h1>修改密码</h1><p class="sub" id="password-hint">修改后，其他设备的登录会话将失效。</p><form id="password-form"><label for="current-password">当前密码</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-password">新密码</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"><label for="confirm-password">确认新密码</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"><p class="note">至少 15 个字符，建议使用不在其他网站使用的长口令。</p><p id="status" class="notice" role="status" aria-live="polite"></p><button class="button primary submit" type="submit">保存新密码</button></form></section></main></body></html>
