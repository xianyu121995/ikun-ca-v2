<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · ikun.ca</title><link rel="stylesheet" href="/auth/assets/auth.css"><script src="/auth/assets/auth.js" defer></script></head><body data-page="users"><header class="topbar"><a class="brand" href="/auth"><span class="brand-mark" aria-hidden="true">i</span><div>ikun.ca<small>Web3 Workspace</small></div></a><nav><span class="who" id="current-user"></span><a href="/auth">我的账号</a><button class="button" data-logout>退出登录</button></nav></header><main class="workspace"><div class="heading"><div><span class="eyebrow">ACCESS MANAGEMENT</span><h1>用户管理</h1><p>创建工作空间账号，管理用户状态与登录密码。</p></div><button class="button primary" id="create-user">＋ 创建用户</button></div><p id="status" class="notice" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th scope="col">用户名</th><th scope="col">角色</th><th scope="col">状态</th><th scope="col">密码</th><th scope="col">操作</th></tr></thead><tbody id="users"><tr><td colspan="5" class="loading">正在加载用户…</td></tr></tbody></table></div><p class="note">普通用户只能查看业务数据。禁用账号或重置密码后，该用户的所有登录会话立即失效。</p></main><dialog id="user-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">创建用户</h2><p class="sub" id="dialog-hint"></p><form id="user-form" method="post" action="/api/v1/auth/users"><div id="create-fields"><label for="new-username">用户名</label><input id="new-username" name="username" autocomplete="off" minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,31}"><label for="new-role">角色</label><select id="new-role" name="role"><option value="user">普通用户 · 仅查看</option><option value="superadmin">超级管理员 · 全部管理权限</option></select></div><div id="password-fields"><label for="temporary-password">临时密码</label><input id="temporary-password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128"><label for="temporary-confirm">确认临时密码</label><input id="temporary-confirm" name="confirm" type="password" autocomplete="new-password" minlength="15" maxlength="128"></div><p id="dialog-status" class="notice" role="status" aria-live="polite"></p><div class="dialog-actions"><button class="button" type="button" id="cancel-dialog">取消</button><button class="button primary" type="submit" id="dialog-submit">创建用户</button></div></form></dialog></body></html>
