[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikun-homepage-projects"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "pydantic==2.14.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.58,<2"]

[tool.setuptools.package-data]
projects_service = ["migrations/*.sql", "static/*"]

[tool.setuptools.packages.find]
include = ["projects_service*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
