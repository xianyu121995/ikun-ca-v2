[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikun-hunterradar"
version = "1.0.0"
description = "Independent HunterRadar collector, SQLite business API and private UI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
hunterradar = "hunterradar.__main__:main"

[tool.setuptools.packages.find]
include = ["hunterradar*"]

[tool.setuptools.package-data]
hunterradar = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
