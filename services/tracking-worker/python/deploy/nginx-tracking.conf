# Candidate only. Include in the existing website server AFTER review; does not change the Tunnel.
# Keep /login and /api/auth/* on the authentication owner. Tracking verifies every session through that API.
location = /tracking {
    proxy_pass http://127.0.0.1:3112;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tracking-assets/ {
    proxy_pass http://127.0.0.1:3112;
    proxy_set_header Host $http_host;
}
location /api/tracking/ {
    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:3112;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/v1/tracking/ {
    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:3112;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
