<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目监控 · ikun.ca</title><link rel="stylesheet" href="/tracking-assets/style.css">
<script src="/tracking-assets/app.js" defer></script></head>
<body><header><a href="/tracking" class="brand">ikun<span>.ca</span></a><span class="divider">/</span><span>猎手 · 项目监控</span>
<div class="header-right"><span id="connection" class="badge">读取状态中</span><button id="logout" hidden>退出</button></div></header>
<main><section class="heading"><div><p class="eyebrow">PROJECT TRACKING</p><h1>持续关注，及时发现。</h1>
<p class="muted">人工确认的项目，独立运行的推文监控。</p></div><button id="add" class="primary" hidden>＋ 添加监控项目</button></section>
<p id="notice" role="status" class="notice" hidden></p>
<section id="login-panel" class="card login" hidden><h2>登录项目监控</h2><p class="muted">使用管理员分配的访问凭证。</p>
<form id="login-form"><label>访问凭证<input id="access-key" type="password" required autocomplete="current-password"></label>
<button class="primary" type="submit">登录</button></form></section>
<div id="workspace" hidden><section class="stats"><article class="card"><span>监控项目</span><strong id="total">—</strong></article>
<article class="card"><span>正在接收</span><strong id="active">—</strong></article><article class="card"><span>待处理 / 恢复中</span><strong id="pending">—</strong></article></section>
<section class="card project-card"><div class="section-head"><h2>监控项目</h2><div class="tools"><input id="search" type="search" placeholder="搜索项目或 X 账号" aria-label="搜索项目">
<label class="inline"><input id="removed" type="checkbox">显示已移除</label><button id="refresh">刷新</button></div></div>
<div class="table-scroll"><table><thead><tr><th>项目 / X 账号</th><th>监控状态</th><th>远端核验</th><th>数据恢复</th><th>操作</th></tr></thead><tbody id="projects"></tbody></table></div>
<p id="empty" class="empty" hidden>还没有监控项目。由超级管理员人工确认后添加。</p>
<p class="footnote">操作提交后等待远端核验。网站关闭不会停止后台引擎；“正在接收”同时要求远端监控启用和实时连接有效。</p></section>
<section class="card feed-card"><div class="section-head"><div><h2>最新动态</h2><p class="muted">仅显示项目账号发布的原创推文</p></div>
<button id="clear-filter" hidden>查看全部项目</button></div><div id="feed"></div><p id="feed-empty" class="empty">暂无已入库的新推文。</p></section></div></main>
<dialog id="project-dialog"><form id="project-form"><div class="section-head"><h2 id="dialog-title">添加监控项目</h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div>
<label>项目名称<input id="project-name" required maxlength="200"></label><label>项目 ID<input id="project-id" required pattern="prj_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}" maxlength="100" placeholder="与项目库一致的项目 ID"></label>
<label>X 账号<input id="project-handle" required pattern="@?[A-Za-z0-9_]{1,15}" maxlength="16" placeholder="@project"></label>
<label>备注<textarea id="project-notes" maxlength="4000" rows="3"></textarea></label>
<label id="confirm-label" class="inline confirmation"><input id="confirmed" type="checkbox" required>我已人工确认此项目与 X 账号，并同意加入监控</label>
<button class="primary" type="submit" id="save-project">确认添加并启动</button></form></dialog>
<footer>ikun.ca <span>项目监控 · NEW_TWEET</span></footer></body></html>
